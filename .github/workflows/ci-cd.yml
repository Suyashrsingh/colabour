name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Quality Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Type Check
        run: npm run check

      - name: Build Project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://lcqfajotecjqwtsuedsd.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'build_check_anon_key' }}

  deploy:
    name: Deploy to Vercel
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel via Action (if tokens provided)
        uses: amondnet/vercel-action@v25
        if: ${{ env.VERCEL_TOKEN != '' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: CI/CD Summary & Status
        run: |
          echo "=========================================================================="
          echo "✓ CI Pipeline: Code compiled, type-checked, and built successfully."
          echo ""
          echo "Automatic Deployment Modes:"
          echo "1. Direct Vercel Git Integration:"
          echo "   If your repository is connected to Vercel via vercel.com/dashboard,"
          echo "   Vercel automatically deploys every push to main to production."
          echo ""
          echo "2. GitHub Actions Deployment:"
          echo "   Configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in"
          echo "   GitHub Repo Settings -> Secrets and variables -> Actions."
          echo "=========================================================================="
